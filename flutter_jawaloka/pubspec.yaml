name: flutter_jawaloka
description: "JawaLoka - Aplikasi Belajar Bahasa & Aksara Jawa."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_svg: ^2.3.2
  intl: ^0.20.2

  # ─── State & Persistence ───────────────────────────────────────────────────
  # Simpan preferensi user: nama, blangkon pilihan, streak harian.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/characters/
    - assets/images/characters/putra_blangkon/
    - assets/images/characters/putri_busana/

  fonts:
    - family: NotoSansJavanese
      fonts:
        - asset: assets/fonts/NotoSansJavanese-Regular.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
